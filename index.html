<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FinSuccess | REE Hydro Dashboard 2026</title></head><body><div id="loading" style="font-family:Arial,sans-serif;padding:40px;text-align:center">Đang tải dashboard...</div><script>(async()=>{try{const files=['hydro-v9/part1.txt','hydro-v9/part2.txt','hydro-v9/part3.txt','hydro-v9/part4.txt','hydro-v9/part5.txt','hydro-v9/part6.txt','hydro-v9/part7.txt','hydro-v9/part8.txt'];const parts=await Promise.all(files.map(f=>fetch(f+'?v=9').then(r=>{if(!r.ok)throw new Error(f+' '+r.status);return r.text()})));const b64=parts.join('');const bin=atob(b64);const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));const ds=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(ds).text();document.open();document.write(html);document.close();}catch(e){document.getElementById('loading').innerHTML='Không tải được dashboard. Vui lòng tải lại trang.<br><small>'+e.message+'</small>';}})();</script></body></html>
