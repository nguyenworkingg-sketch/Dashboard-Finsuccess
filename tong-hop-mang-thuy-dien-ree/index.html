ng không xấu nhiều so với FY25. Khi cộng thêm giả định mặt bằng giá điện thị trường cao hơn nền thấp 2025, tác động lợi nhuận cả năm cải thiện rõ hơn; kịch bản cơ sở hiện phù hợp với mức khoảng <b>+80 tỷ đồng</b> cho mảng thủy điện.</div></div>');const impactBlock='<div class="the" style="margin-top:16px"><h3>Tác động lợi nhuận theo nhà máy</h3><div class="chartbox"><canvas id="impactChart"></canvas></div></div>';const summaryBlock='<div class="the" style="margin-top:16px"><h3>Tổng hợp tác động lên KQKD thủy điện REE</h3><div class="nhanxet"><b>Danh mục thủy điện của REE có công suất quy đổi theo tỷ lệ sở hữu kinh tế khoảng 573 MW</b>, trong đó 5 tài sản có mức đóng góp lớn nhất — <b>Thượng Kon Tum, Thác Bà, Thác Mơ, Sông Ba Hạ và A Lưới</b> — chiếm khoảng <b>61% tổng công suất quy đổi</b>. Vì vậy, diễn biến thủy văn tại nhóm này có ảnh hưởng lớn nhất đến sản lượng theo góc nhìn kinh tế của REE. Trong Q3/26, tín hiệu nước tại phần lớn khu vực miền Trung/Tây Nguyên vẫn yếu hơn cùng kỳ, nên sản lượng ở một số nhà máy lớn có thể giảm. Tuy nhiên, <b>giá CGM/FMP 2026 đang cao hơn đáng kể so với nền 2025</b>, với bình quân T1–T7/2026 khoảng <b>1.466 đ/kWh</b> (+<b>37%</b> YoY) và T7/2026 đạt <b>1.250 đ/kWh</b>. Do đó, tác động lợi nhuận thực tế có khả năng <b>ít tiêu cực hơn đáng kể so với chỉ nhìn vào sản lượng</b>. Với FY26, khi thủy văn cả năm dự kiến gần mức cùng kỳ và mặt bằng giá điện tốt hơn, mảng thủy điện vẫn có khả năng đóng góp lợi nhuận tích cực cho REE, nhưng mức độ còn phụ thuộc vào Q4, cơ chế Qc/CGM, mức huy động và thời điểm ghi nhận tại từng nhà máy.</div><div class="note" style="margin-top:12px"><b>Lưu ý về tỷ lệ sở hữu:</b> phân tích sử dụng tỷ lệ kinh tế của REE theo danh sách cập nhật; với Đắk Nghé, tỷ lệ áp dụng cho 2026 là khoảng 52,57% thay vì 99,99% tại 31/12/2025.</div></div>';html=html.replace(impactBlock,summaryBlock);html=html.replace(/const impact=\[\.\.\.PLANTS\][\s\S]*?slice\(0,14\);/,'').replace(/new Chart\(document\.getElementById\("impac
