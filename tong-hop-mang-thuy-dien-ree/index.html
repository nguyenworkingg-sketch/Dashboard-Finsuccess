<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FinSuccess | Tổng hợp mảng thủy điện REE</title></head><body><div id="loading" style="font-family:Arial,sans-serif;padding:40px;text-align:center">Đang tải Tổng hợp mảng thủy điện REE...</div><script>(async()=>{try{const files=['../hydro-v9/part1.txt','../hydro-v9/part2.txt','../hydro-v9/part3.txt','../hydro-v9/part4.txt','../hydro-v9/part5.txt','../hydro-v9/part6.txt','../hydro-v9/part7.txt','../hydro-v9/part8.txt'];const parts=await Promise.all(files.map(f=>fetch(f+'?v=16').then(r=>{if(!r.ok)throw new Error(f+' '+r.status);return r.text()})));const raw=parts.join('').replace(/\s+/g,'');const bin=atob(raw);const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));const ds=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));let html=await new Response(ds).text();html=html.replace('<title>FinSuccess | REE Hydro Dashboard 2026</title>','<title>FinSuccess | Tổng hợp mảng thủy điện REE</title>').replace('<div class="hero"><div class="nhan">Bảng theo dõi thủy văn</div><h1>Theo dõi thủy điện REE 2026</h1>','<div class="hero"><div class="nhan">Tổng hợp mảng thủy điện REE</div><h1>Tổng hợp mảng thủy điện REE</h1>');html=html.replace('<div class="ketluan-dau"><span>Kết luận nhanh:</span> Q3/26 đang cho tín hiệu thủy văn yếu hơn cùng kỳ tại phần lớn exposure miền Trung/Tây Nguyên của REE; tuy nhiên bức tranh FY26 chưa xấu tương ứng vì đầu năm có một số tháng nước tốt hơn và Q4 còn phụ thuộc nhịp hồi thủy văn. Dashboard tách riêng <b>nước</b> và <b>giá điện</b> để tránh suy luận quá mức từ mực nước hồ.</div>','<div class="ketluan-dau"><span>Kết luận nhanh:</span> Q3/26 đang cho tín hiệu thủy văn yếu hơn cùng kỳ tại phần lớn danh mục miền Trung/Tây Nguyên của REE; tuy nhiên <b>giá CGM/FMP 2026 đang cao hơn đáng kể so với nền thấp 2025</b>, nên phần bất lợi từ sản lượng có thể được bù đáng kể. Với FY26, thủy văn cả năm dự kiến gần cùng kỳ hơn và mặt bằng giá tốt hơn tạo dư địa để mảng thủy điện tiếp tục đóng góp tích cực.</div>');html=html.replace('<div class="the kpi"><div class="ten">Tác động LNST thủy điện Q3</div><div class="so">-41 tỷ</div><div class="diengiai">Ước tính định hướng so với mốc Q3/25</div></div>','<div class="the kpi"><div class="ten">Định hướng KQKD thủy điện Q3</div><div class="so">Giảm nhẹ</div><div class="diengiai">Sản lượng yếu hơn cùng kỳ nhưng được giá CGM bù đỡ một phần</div></div>').replace('<div class="the kpi"><div class="ten">Tác động LNST thủy điện FY26</div><div class="so">+43 tỷ</div><div class="diengiai">Kịch bản cơ sở, phụ thuộc giá điện và Q4</div></div>','<div class="the kpi"><div class="ten">Định hướng KQKD thủy điện FY26</div><div class="so">Tích cực nhẹ</div><div class="diengiai">Kịch bản cơ sở nghiêng về trung tính đến tích cực nhờ giá điện tốt hơn</div></div>');html=html.replace('<div class="the"><h3>Q3/26</h3><div class="nhanxet">Chỉ số thủy văn ~<b>0.84x</b>. Với giả định giá điện +5% so với cùng kỳ và đòn bẩy hoạt động 1,15x, mảng thủy điện tạo tác động ước tính khoảng <b>-41 tỷ đồng</b> so với mốc Q3/25.</div></div>','<div class="the"><h3>Q3/26</h3><div class="nhanxet">Chỉ số thủy văn ~<b>0.84x</b>, tức nếu chỉ nhìn nước thì Q3 sẽ kém cùng kỳ. Tuy nhiên <b>giá CGM tăng mạnh</b> giúp bù lại đáng kể phần giảm sản lượng. Bình quân T1–T7/2026 khoảng <b>1.466 đ/kWh</b>, tăng gần <b>37% YoY</b>; riêng T7/2026 đạt <b>1.250 đ/kWh</b>. Vì vậy góc nhìn hiện tại là <b>Q3 nhiều khả năng chỉ giảm nhẹ</b>; nếu giá duy trì cao trong T8–T9 thì kịch bản gần hòa vốn là khả thi.</div></div>').replace('<div class="the"><h3>FY26</h3><div class="nhanxet">Chỉ số thủy văn theo kịch bản cơ sở ~<b>0.98x</b>. Kết quả cả năm ít tiêu cực hơn Q3 vì phần đầu năm thuận lợi hơn và Q4 đang giả định trở về mức bình thường; tác động lợi nhuận khoảng <b>+43 tỷ đồng</b>.</div></div>','<div class="the"><h3>FY26</h3><div class="nhanxet">Chỉ số thủy văn theo kịch bản cơ sở ~<b>0.98x</b>, tức nền sản lượng cả năm nhìn chung không xấu nhiều so với FY25. Khi cộng thêm mặt bằng giá điện thị trường cao hơn nền thấp 2025, kịch bản cơ sở nghiêng về <b>trung tính đến tích cực</b> cho mảng thủy điện.</div></div>');const impactBlock='<div class="the" style="margin-top:16px"><h3>Tác động lợi nhuận theo nhà máy</h3><div class="chartbox"><canvas id="impactChart"></canvas></div></div>';const summaryBlock='<div class="the" style="margin-top:16px"><h3>Tổng hợp tác động lên KQKD thủy điện REE</h3><div class="nhanxet"><b>Danh mục thủy điện của REE có công suất quy đổi theo tỷ lệ sở hữu kinh tế khoảng 573 MW</b>, trong đó 5 tài sản có mức đóng góp lớn nhất — <b>Thượng Kon Tum, Thác Bà, Thác Mơ, Sông Ba Hạ và A Lưới</b> — chiếm khoảng <b>61% tổng công suất quy đổi</b>. Trong Q3/26, tín hiệu nước tại phần lớn khu vực miền Trung/Tây Nguyên vẫn yếu hơn cùng kỳ, nên sản lượng ở một số nhà máy lớn có thể giảm. Tuy nhiên, <b>giá CGM/FMP 2026 đang cao hơn đáng kể so với nền 2025</b>, do đó tác động lợi nhuận thực tế có khả năng <b>ít tiêu cực hơn đáng kể so với chỉ nhìn vào sản lượng</b>. Với FY26, khi thủy văn cả năm dự kiến gần mức cùng kỳ và mặt bằng giá điện tốt hơn, mảng thủy điện vẫn có khả năng đóng góp tích cực cho REE.</div><div class="note" style="margin-top:12px"><b>Lưu ý về tỷ lệ sở hữu:</b> với Đắk Nghé, tỷ lệ áp dụng cho 2026 là khoảng 52,57% thay vì 99,99% tại 31/12/2025.</div></div>';const cgmBlock='<div class="luoi hai" style="margin-top:16px"><div class="the"><h3>Giá điện CGM/FMP 2025–2026</h3><div class="nho">Dữ liệu giá toàn phần thị trường điện. 2026 hiện cập nhật đến T7; <b>giá CGM T7/2026 = 1.250 đ/kWh</b>.</div><div style="height:330px;margin-top:14px"><svg viewBox="0 0 680 240" width="100%" height="100%" role="img" aria-label="Biểu đồ giá điện CGM 2025 và 2026"><line x1="35" y1="205" x2="645" y2="205" stroke="#dfe3ed"/><line x1="35" y1="145" x2="645" y2="145" stroke="#eef0f4"/><line x1="35" y1="85" x2="645" y2="85" stroke="#eef0f4"/><line x1="35" y1="25" x2="645" y2="25" stroke="#eef0f4"/><polyline points="35,139.5 136.7,96.8 238.3,90.8 340,91.2 441.7,110.9 543.3,195.1 645,178.1" fill="none" stroke="#f4b82d" stroke-width="4"/><polyline points="35,120.9 136.7,115.4 238.3,76 340,51.5 441.7,63.3 543.3,53.8 645,108.7" fill="none" stroke="#202a83" stroke-width="4"/><g fill="#6f7485" font-size="12"><text x="27" y="225">T1</text><text x="128" y="225">T2</text><text x="230" y="225">T3</text><text x="332" y="225">T4</text><text x="433" y="225">T5</text><text x="535" y="225">T6</text><text x="637" y="225">T7</text><text x="2" y="207">400</text><text x="2" y="147">900</text><text x="0" y="87">1.400</text><text x="0" y="27">1.900</text></g><g font-size="12" font-weight="700"><rect x="440" y="8" width="12" height="4" fill="#202a83"/><text x="458" y="14" fill="#202430">CGM 2026</text><rect x="535" y="8" width="12" height="4" fill="#f4b82d"/><text x="553" y="14" fill="#202430">CGM 2025</text></g></svg></div></div><div class="the"><h3>Điểm rút ra cho REE</h3><div class="nhanxet"><b>Giá điện đang là biến số bù đỡ quan trọng cho sản lượng.</b> Bình quân T1–T7/2026 đạt khoảng <b>1.466 đ/kWh</b>, tăng khoảng <b>36,8%</b> so với mức khoảng <b>1.071 đ/kWh</b> cùng kỳ 2025. Riêng T7/2026 đạt <b>1.250 đ/kWh</b>, gần gấp đôi mức <b>637 đ/kWh</b> của T7/2025. Vì vậy, khi đọc KQKD thủy điện REE không nên suy luận trực tiếp từ mức giảm sản lượng: mặt bằng giá thị trường cao hơn có thể bù một phần đáng kể.</div><div class="bangwrap" style="margin-top:14px"><table class="bang"><tr><th>Chỉ tiêu</th><th>T1–T7/2025</th><th>T1–T7/2026</th><th>Thay đổi</th></tr><tr><td>Giá CGM bình quân</td><td>1.071 đ/kWh</td><td>1.466 đ/kWh</td><td><span class="pill xanh">+36,8%</span></td></tr><tr><td>Giá CGM tháng 7</td><td>637 đ/kWh</td><td>1.250 đ/kWh</td><td><span class="pill xanh">+96,2%</span></td></tr></table></div></div></div>';html=html.replace(impactBlock,cgmBlock+summaryBlock);html=html.replace(/const impact=\[\.\.\.PLANTS\][\s\S]*?slice\(0,14\);/,'').replace(/new Chart\(document\.getElementById\("impactChart"\)[\s\S]*?\}\}\);/,'');const replacements=[['Chỉ số Qve và độ đầy hồ','Chỉ số lưu lượng nước về hồ và độ đầy hồ'],['Chọn hồ để xem độ đầy hồ và Qve theo tháng.','Chọn hồ để xem độ đầy hồ và lưu lượng nước về hồ theo tháng.'],['biểu đồ hiển thị Qve và độ đầy hồ so cùng kỳ.','biểu đồ hiển thị lưu lượng nước về hồ và độ đầy hồ so cùng kỳ.'],['Qve 2026','Lưu lượng nước về hồ 2026'],['Qve 2025','Lưu lượng nước về hồ 2025'],['Qxm 2026','Lưu lượng nước qua máy 2026'],['<th>Htl</th>','<th>Mực nước thượng lưu</th>'],['<th>Hdbt</th>','<th>Mực nước dâng bình thường</th>'],['<th>Hc</th>','<th>Mực nước chết</th>'],['<th>Qve</th>','<th>Lưu lượng nước về hồ</th>'],['<th>Qx</th>','<th>Tổng lưu lượng xả</th>'],['<th>Qxt</th>','<th>Lưu lượng xả tràn</th>'],['<th>Qxm</th>','<th>Lưu lượng nước qua máy</th>'],['<th>Qve cùng kỳ</th>','<th>Lưu lượng nước về hồ cùng kỳ</th>'],['<th>Qve so CK</th>','<th>Biến động so cùng kỳ</th>']];replacements.forEach(([a,b])=>{html=html.split(a).join(b)});document.open();document.write(html);document.close();}catch(e){document.getElementById('loading').innerHTML='Không tải được dashboard.<br><small>'+e.message+'</small>';}})();</script></body></html>
