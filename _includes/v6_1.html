<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FinSuccess | Dashboard ngành phân bón</title>
<style>
:root{--xanh:#202a83;--xanh2:#3340a0;--vang:#f4b82d;--chu:#202430;--mo:#6f7485;--vien:#e5e7ef;--nen:#fbfbfd;--xanhla:#198754;--do:#c94848;--cam:#c47a16;--shadow:0 10px 30px rgba(32,42,131,.07)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--nen);color:var(--chu);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}body:before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background:linear-gradient(135deg,transparent 0 23%,rgba(32,42,131,.022) 23% 27%,transparent 27% 49%,rgba(32,42,131,.022) 49% 53%,transparent 53% 75%,rgba(32,42,131,.022) 75% 79%,transparent 79%)}
.khung{max-width:1500px;margin:auto;padding:24px 30px 56px}.dau{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:16px}.logo{width:205px;max-height:82px;object-fit:contain}.meta{font-size:12px;color:var(--mo);line-height:1.55;text-align:right}.ketluan-dau{margin:0 0 16px;padding:15px 18px;border-radius:14px;background:linear-gradient(100deg,var(--xanh),#343fa0);color:#fff;font-size:17px;font-weight:800;line-height:1.55;box-shadow:var(--shadow)}.ketluan-dau span{color:#ffd96b}.hero{background:linear-gradient(115deg,#fff 0%,#fff 72%,#f3f4fa 100%);border:1px solid var(--vien);border-radius:22px;padding:30px 32px;box-shadow:var(--shadow);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:350px;height:350px;border-radius:50%;right:-200px;top:-205px;background:radial-gradient(circle,rgba(244,184,45,.23),rgba(244,184,45,0) 68%)}.nhan{font-size:12px;font-weight:850;color:var(--xanh);letter-spacing:.08em;text-transform:uppercase}h1{font-size:clamp(32px,4vw,54px);line-height:1.03;color:var(--xanh);margin:6px 0 10px;letter-spacing:-.035em}.phude{font-size:18px;font-weight:650;color:#3b4052;max-width:1180px;line-height:1.5}.luandiem{margin-top:20px;padding:16px 18px;border-left:5px solid var(--vang);background:#fff8e7;border-radius:10px;font-size:15px;line-height:1.62;max-width:1260px}.luandiem b{color:var(--xanh)}
.menu{position:sticky;top:0;z-index:20;display:flex;gap:8px;flex-wrap:wrap;padding:10px 0;margin:15px 0;background:rgba(251,251,253,.95);backdrop-filter:blur(8px)}.menu a{text-decoration:none;border:1px solid var(--vien);background:#fff;color:#41465a;border-radius:999px;padding:9px 14px;font-weight:760;font-size:13px}.menu a:hover{background:var(--xanh);color:#fff;border-color:var(--xanh)}
.phan{margin-top:28px;padding:18px 20px;border-radius:18px;background:linear-gradient(100deg,var(--xanh),#343fa0);color:white;box-shadow:var(--shadow)}.phan .so-phan{font-size:11px;font-weight:850;letter-spacing:.1em;text-transform:uppercase;opacity:.8}.phan h2{margin:4px 0 4px;font-size:28px;letter-spacing:-.025em}.phan p{margin:0;opacity:.86;font-size:13px;line-height:1.5}
.khoi{margin-top:18px;scroll-margin-top:78px}.tieude-khoi{display:flex;align-items:flex-end;justify-content:space-between;gap:15px;margin:0 0 10px}.tieude-khoi h2{margin:0;color:var(--xanh);font-size:23px;letter-spacing:-.02em}.tieude-khoi p{margin:0;color:var(--mo);font-size:12px}.luoi{display:grid;gap:16px}.hai{grid-template-columns:repeat(2,1fr)}.ba{grid-template-columns:repeat(3,1fr)}.bon{grid-template-columns:repeat(4,1fr)}.the{background:#fff;border:1px solid var(--vien);border-radius:18px;padding:20px;box-shadow:0 7px 20px rgba(31,36,48,.035)}.the h3{margin:0 0 8px;color:var(--xanh);font-size:18px}.nho{font-size:12px;color:var(--mo);line-height:1.5}.nhanxet{font-size:14px;line-height:1.64;color:#343949}.nhanxet b{color:var(--xanh)}
.kpi{position:relative;overflow:hidden}.kpi:after{content:"";position:absolute;right:0;top:0;width:6px;height:100%;background:var(--vang)}.kpi .ten{font-size:12px;color:var(--mo);font-weight:750}.kpi .so{font-size:29px;font-weight:900;color:var(--xanh);margin:5px 0 2px}.kpi .diengiai{font-size:12px;color:#555a6c;line-height:1.45}.goiy{padding:14px 15px;border-radius:13px;border:1px solid #e7e8f0;background:#f7f8fc;font-size:13px;line-height:1.58}.tot{background:#edf8f2;border-color:#d7eee1}.canhbao{background:#fff7e8;border-color:#f1dfb5}.xau{background:#fff0ef;border-color:#f3d5d1}.trungtinh{background:#f4f5fb;border-color:#e0e2ef}
.bang{width:100%;border-collapse:collapse;font-size:13px}.bang th,.bang td{padding:10px;border-bottom:1px solid var(--vien);vertical-align:top}.bang th{background:#f6f7fb;color:var(--xanh);text-align:left;font-size:12px}.bang td:first-child{font-weight:800}.duong{height:340px;position:relative}svg{width:100%;height:100%;overflow:visible}.gridline{stroke:#edf0f4;stroke-width:1}.axis{stroke:#d8dbe5;stroke-width:1}.tick{font-size:10px;fill:#858a98}.line-a{fill:none;stroke:var(--xanh);stroke-width:3.3}.line-b{fill:none;stroke:var(--vang);stroke-width:3}.dot-a{fill:var(--xanh)}.dot-b{fill:var(--vang)}.eventline{stroke:#c6c9d6;stroke-dasharray:5 5}.eventtext{font-size:10px;fill:#6d7282}.chu-thich{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mo);margin-bottom:7px}.chu-thich span:before{content:"";width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px;background:var(--mau)}
.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.nut{padding:14px 12px;border:1px solid var(--vien);border-radius:14px;background:#fff;text-align:center;min-height:112px;display:flex;flex-direction:column;justify-content:center}.nut b{color:var(--xanh);font-size:14px}.nut span{font-size:12px;color:var(--mo);line-height:1.45;margin-top:5px}.pill{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800;white-space:nowrap}.pill.xanh{background:#e8f5ee;color:#167245}.pill.vang{background:#fff2cf;color:#8a6211}.pill.do{background:#fde9e8;color:#a33c38}.pill.xam{background:#eef0f5;color:#5f6575}
.nhom{border-top:4px solid var(--xanh)}.nhom .mucdo{font-size:30px;font-weight:900;color:var(--xanh);margin:8px 0 2px}.nhom .mota{font-size:12px;color:var(--mo)}.score{display:grid;grid-template-columns:1.25fr repeat(4,.75fr);gap:0;border:1px solid var(--vien);border-radius:14px;overflow:hidden;font-size:12px}.score>div{padding:10px;border-right:1px solid var(--vien);border-bottom:1px solid var(--vien)}.score>div:nth-child(5n){border-right:0}.score .hd{background:#f6f7fb;color:var(--xanh);font-weight:800}.score .rowname{font-weight:800}.nguon{font-size:12px;line-height:1.75;color:#606676}.nguon a{color:var(--xanh);text-decoration:none}.nguon a:hover{text-decoration:underline}.chan{margin-top:20px;padding-top:14px;border-top:1px solid var(--vien);font-size:11px;color:#7b8090;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
