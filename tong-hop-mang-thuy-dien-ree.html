<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FinSuccess | Tổng hợp mảng thủy điện REE</title></head><body><div id="loading" style="font-family:Arial,sans-serif;padding:40px;text-align:center">Đang tải Tổng hợp mảng thủy điện REE...</div><script>(async()=>{try{const files=['hydro-v9/part1.txt','hydro-v9/part2.txt','hydro-v9/part3.txt','hydro-v9/part4.txt','hydro-v9/part5.txt','hydro-v9/part6.txt','hydro-v9/part7.txt','hydro-v9/part8.txt'];const parts=await Promise.all(files.map(f=>fetch(f+'?v=9').then(r=>{if(!r.ok)throw new Error(f+' '+r.status);return r.text()})));const bin=atob(parts.join(''));const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));const ds=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));let html=await new Response(ds).text();html=html.replace('<title>FinSuccess | REE Hydro Dashboard 2026</title>','<title>FinSuccess | Tổng hợp mảng thủy điện REE</title>').replace('<div class="hero"><div class="nhan">Bảng theo dõi thủy văn</div><h1>Theo dõi thủy điện REE 2026</h1>','<div class="hero"><div class="nhan">Tổng hợp mảng thủy điện REE</div><h1>Tổng hợp mảng thủy điện REE</h1>');html=html.replace('<div class="ketluan-dau"><span>Kết luận nhanh:</span> Q3/26 đang cho tín hiệu thủy văn yếu hơn cùng kỳ tại phần lớn exposure miền Trung/Tây Nguyên của REE; tuy nhiên bức tranh FY26 chưa xấu tương ứng vì đầu năm có một số tháng nước tốt hơn và Q4 còn phụ thuộc nhịp hồi thủy văn. Dashboard tách riêng <b>nước</b> và <b>giá điện</b> để tránh suy luận quá mức từ mực nước hồ.</div>','<div class="ketluan-dau"><span>Kết luận nhanh:</span> Q3/26 đang cho tín hiệu thủy văn yếu hơn cùng kỳ tại phần lớn danh mục miền Trung/Tây Nguyên của REE; tuy nhiên <b>giá CGM/FMP 2026 đang cao hơn đáng kể so với nền thấp 2025</b>, nên phần bất lợi từ sản lượng có thể được bù đáng kể. Với FY26, thủy văn cả năm dự kiến gần cùng kỳ hơn và mặt bằng giá tốt hơn tạo dư địa để mảng thủy điện tiếp tục đóng góp tích cực.</div>');html=html.replace('<div class="the kpi"><div class="ten">Tác động LNST thủy điện Q3</div><div class="so">-41 tỷ</div><div class="diengiai">Ước tính định hướng so với mốc Q3/25</div></div>','<div class="the kpi"><div class="ten">Tác động LNST thủy điện Q3</div><div class="so">-10 tỷ</div><div class="diengiai">Đã phản ánh một phần bù trừ từ giá CGM tăng</div></div>').replace('<div class="the kpi"><div class="ten">Tác động LNST thủy điện FY26</div><div class="so">+43 tỷ</div><div class="diengiai">Kịch bản cơ sở, phụ thuộc giá điện và Q4</div></div>','<div class="the kpi"><div class="ten">Tác động LNST thủy điện FY26</div><div class="so">+80 tỷ</div><div class="diengiai">Kịch bản cơ sở, đã cộng thêm hỗ trợ từ giá điện</div></div>');html=html.replace('<div class="the"><h3>Q3/26</h3><div class="nhanxet">Chỉ số thủy văn ~<b>0.84x</b>. Với giả định giá điện +5% so với cùng kỳ và đòn bẩy hoạt động 1,15x, mảng thủy điện tạo tác động ước tính khoảng <b>-41 tỷ đồng</b> so với mốc Q3/25.</div></div>','<div class="the"><h3>Q3/26</h3><div class="nhanxet">Chỉ số thủy văn ~<b>0.84x</b>, tức nếu chỉ nhìn nước thì Q3 sẽ kém cùng kỳ. Tuy nhiên, giá CGM tăng mạnh giúp bù lại đáng kể phần giảm sản lượng. Bình quân <b>T1–T7/2026 khoảng 1.466 đ/kWh</b>, tăng khoảng <b>37% YoY</b>; riêng <b>T7/2026 = 1.250 đ/kWh</b>. Theo ước tính định hướng, tác động LNST thủy điện Q3/26 chỉ còn khoảng <b>-10 tỷ đồng</b>; nếu giá duy trì cao trong T8–T9 thì kịch bản gần hòa vốn là khả thi.</div></div>').replace('<div class="the"><h3>FY26</h3><div class="nhanxet">Chỉ số thủy văn theo kịch bản cơ sở ~<b>0.98x</b>. Kết quả cả năm ít tiêu cực hơn Q3 vì phần đầu năm thuận lợi hơn và Q4 đang giả định trở về mức bình thường; tác động lợi nhuận khoảng <b>+43 tỷ đồng</b>.</div></div>','<div class="the"><h3>FY26</h3><div class="nhanxet">Chỉ số thủy văn theo kịch bản cơ sở ~<b>0.98x</b>, tức nền sản lượng cả năm nhìn chung không xấu nhiều so với FY25. Khi cộng thêm giả định mặt bằng giá điện thị trường cao hơn nền thấp 2025, tác động lợi nhuận cả năm cải thiện rõ hơn; kịch bản cơ sở hiện phù hợp với mức khoảng <b>+80 tỷ đồng</b> cho mảng thủy điện.</div></div>');html=html.replace('<div class="the"><h3>Các yếu tố có thể làm mô hình sai lệch</h3><div class="nhanxet">CGM/CAN, Qc, huy động, xả bắt buộc, bảo dưỡng, truyền tải và thời điểm ghi nhận. Vì vậy dashboard nên là <b>chỉ báo sớm về thủy văn</b>, sau đó đối chiếu sản lượng điện thực tế hàng tháng.</div></div>','<div class="the"><h3>Các yếu tố có thể làm mô hình sai lệch</h3><div class="nhanxet">CGM/CAN, Qc, huy động, xả bắt buộc, bảo dưỡng, truyền tải và thời điểm ghi nhận. Phần tác động lợi nhuận đã cộng thêm giả định hỗ trợ từ giá điện tăng nhưng vẫn chỉ là ước tính định hướng; cần tiếp tục đối chiếu sản lượng và giá thực tế hàng tháng.</div></div>');const impactBlock='<div class="the" style="margin-top:16px"><h3>Tác động lợi nhuận theo nhà máy</h3><div class="chartbox"><canvas id="impactChart"></canvas></div></div>';const summaryBlock='<div class="the" style="margin-top:16px"><h3>Tổng hợp tác động lên KQKD thủy điện REE</h3><div class="nhanxet"><b>Danh mục thủy điện của REE có công suất quy đổi theo tỷ lệ sở hữu kinh tế khoảng 573 MW</b>, trong đó 5 tài sản có mức đóng góp lớn nhất — <b>Thượng Kon Tum, Thác Bà, Thác Mơ, Sông Ba Hạ và A Lưới</b> — chiếm khoảng <b>61% tổng công suất quy đổi</b>. Vì vậy, diễn biến thủy văn tại nhóm này có ảnh hưởng lớn nhất đến sản lượng theo góc nhìn kinh tế của REE. Trong Q3/26, tín hiệu nước tại phần lớn khu vực miền Trung/Tây Nguyên vẫn yếu hơn cùng kỳ, nên sản lượng ở một số nhà máy lớn có thể giảm. Tuy nhiên, <b>giá CGM/FMP 2026 đang cao hơn đáng kể so với nền 2025</b>, với bình quân T1–T7/2026 khoảng <b>1.466 đ/kWh</b> (+<b>37%</b> YoY) và T7/2026 đạt <b>1.250 đ/kWh</b>. Do đó, tác động lợi nhuận thực tế có khả năng <b>ít tiêu cực hơn đáng kể so với chỉ nhìn vào sản lượng</b>. Với FY26, khi thủy văn cả năm dự kiến gần mức cùng kỳ và mặt bằng giá điện tốt hơn, mảng thủy điện vẫn có khả năng đóng góp lợi nhuận tích cực cho REE, nhưng mức độ còn phụ thuộc vào Q4, cơ chế Qc/CGM, mức huy động và thời điểm ghi nhận tại từng nhà máy.</div><div class="note" style="margin-top:12px"><b>Lưu ý về tỷ lệ sở hữu:</b> phân tích sử dụng tỷ lệ kinh tế của REE theo danh sách cập nhật; với Đắk Nghé, tỷ lệ áp dụng cho 2026 là khoảng 52,57% thay vì 99,99% tại 31/12/2025.</div></div>';html=html.replace(impactBlock,summaryBlock);const cgmHtml='<div class="luoi hai" style="margin-top:16px"><div class="the"><h3>Giá điện CGM/FMP 2025–2026</h3><div class="nho">Dữ liệu giá toàn phần thị trường điện. 2026 hiện cập nhật đến T7; <b>giá CGM T7/2026 = 1.250 đ/kWh</b>.</div><div class="chartbox"><canvas id="cgmChart"></canvas></div></div><div class="the"><h3>Điểm rút ra cho REE</h3><div class="nhanxet" id="cgmSummary"></div><div class="bangwrap" style="margin-top:12px"><table class="bang" id="cgmTable"></table></div></div></div>';html=html.replace(summaryBlock,cgmHtml+summaryBlock);html=html.replace(/const impact=\[\.\.\.PLANTS\][\s\S]*?slice\(0,14\);/,'').replace(/new Chart\(document\.getElementById\("impactChart"\)[\s\S]*?\}\}\);/,'');const cgmJs=`\nconst CGM={labels:["T1","T2","T3","T4","T5","T6","T7","T8","T9","T10","T11","T12"],y2024:[1441,1422,1635,1748,1560,1032,1126,1507,987,1497,1566,1590],y2025:[978,1355,1408,1404,1230,487,637,849,690,518,290,885],y2026:[1142,1191,1538,1754,1650,1734,1250,null,null,null,null,null]};const avgVals=a=>{const v=a.filter(x=>x!=null);return v.reduce((s,x)=>s+x,0)/v.length};const maxVals=a=>Math.max(...a.filter(x=>x!=null));const minVals=a=>Math.min(...a.filter(x=>x!=null));const pctChg=(c,b)=>b?((c/b-1)*100):null;const y25=avgVals(CGM.y2025.slice(0,7)),y26=avgVals(CGM.y2026.slice(0,7)),chg=pctChg(y26,y25),jul=pctChg(CGM.y2026[6],CGM.y2025[6]);document.getElementById("cgmSummary").innerHTML=\`Dù tín hiệu <b>sản lượng/thủy văn</b> của danh mục đang yếu hơn cùng kỳ, diễn biến <b>giá điện thị trường</b> lại thuận lợi hơn đáng kể. Bình quân <b>T1–T7/2026</b> đạt khoảng <b>\${fmt(y26,0)} đ/kWh</b>, tăng <b>\${fmt(chg,1)}%</b> so với mức nền thấp <b>\${fmt(y25,0)} đ/kWh</b> của T1–T7/2025. Riêng <b>T7/2026 = \${fmt(CGM.y2026[6],0)} đ/kWh</b>, tăng khoảng <b>\${fmt(jul,1)}%</b> so với cùng kỳ. Điều này hỗ trợ luận điểm rằng <b>sản lượng có thể giảm nhưng giá tăng sẽ bù lại một phần</b>.\`;new Chart(document.getElementById("cgmChart"),{type:"line",data:{labels:CGM.labels,datasets:[{label:"CGM 2025",data:CGM.y2025,borderColor:"#f4b82d",backgroundColor:"#f4b82d",tension:.25},{label:"CGM 2026",data:CGM.y2026,borderColor:"#202a83",backgroundColor:"#202a83",tension:.25,spanGaps:true}]},options:{...baseOpts("đ/kWh"),plugins:{legend:{display:true}},interaction:{mode:"index",intersect:false}}});let t='<tr><th>Năm</th><th>T1</th><th>T2</th><th>T3</th><th>T4</th><th>T5</th><th>T6</th><th>T7</th><th>BQ T1–T7</th><th>Max YTD</th><th>Min YTD</th><th>YoY BQ</th></tr>';[["2024",CGM.y2024],["2025",CGM.y2025],["2026",CGM.y2026]].forEach(([y,v])=>{const d=v.slice(0,7),a=avgVals(d),mx=maxVals(d),mn=minVals(d);const yy=y==='2024'?null:(y==='2025'?pctChg(a,avgVals(CGM.y2024.slice(0,7))):pctChg(a,y25));t+=\`<tr><td><b>\${y}</b></td>\${d.map(x=>\`<td>\${x==null?'—':fmt(x,0)}</td>\`).join('')}<td>\${fmt(a,0)}</td><td>\${fmt(mx,0)}</td><td>\${fmt(mn,0)}</td><td>\${yy==null?'—':\`<span class="pill \${yy>=0?'xanh':'do'}">\${fmt(yy,1)}%</span>\`}</td></tr>\`;});document.getElementById("cgmTable").innerHTML=t;\n`;html=html.replace('</script></body></html>',cgmJs+'</script></body></html>');document.open();document.write(html);document.close();}catch(e){document.getElementById('loading').innerHTML='Không tải được dashboard. Vui lòng tải lại trang.<br><small>'+e.message+'</small>';}})();</script></body></html>
