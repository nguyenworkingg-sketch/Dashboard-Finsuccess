<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard Phân bón</title><style>body{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;margin:0;padding:32px;background:#fbfbfd;color:#202430}.msg{max-width:720px;margin:10vh auto;padding:24px;border:1px solid #e5e7ef;border-radius:16px;background:#fff}h1{color:#202a83}small{color:#6f7485}</style></head><body><div class="msg"><h1>Đang tải Dashboard Phân bón…</h1><small>FinSuccess</small></div><script>(async()=>{try{const files=['chunk1.txt','chunk2.txt','chunk3.txt','chunk4.txt','chunk5.txt','chunk6.txt','chunk7.txt'];const parts=await Promise.all(files.map(async f=>{const r=await fetch('../v7/'+f,{cache:'no-store'});if(!r.ok)throw new Error(f+' '+r.status);return await r.text()}));document.open();document.write(parts.join(''));document.close()}catch(e){document.body.innerHTML='<div class="msg"><h1>Không tải được dashboard</h1><p>'+e.message+'</p></div>'}})();</script></body></html>
