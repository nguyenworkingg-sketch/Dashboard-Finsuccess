<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REE M&E Dashboard</title></head><body><script>(async()=>{const ps=['parts/me.1','parts/me.2','parts/me.3'];let h='';for(const p of ps)h+=await fetch(p).then(r=>r.text());document.open();document.write(h);document.close()})().catch(e=>document.body.innerHTML='<pre style="padding:20px;color:#b42318">Lỗi tải dashboard M&E: '+e.message+'</pre>');</script></body></html>
