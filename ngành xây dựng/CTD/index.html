<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CTD | Thị trường xây dựng phía Nam 2026</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="khung" id="noi-dung"></div>
<script>
const tep = ['phan-1.html', 'phan-2.html', 'phan-3.html', 'phan-4.html', 'phan-5.html'];
Promise.all(tep.map(x=>fetch(x).then(r=>{if(!r.ok) throw new Error(x); return r.text()})))
.then(ds=>{document.getElementById('noi-dung').innerHTML=ds.join('\n')})
.catch(e=>{document.getElementById('noi-dung').innerHTML='<div style="padding:24px;font-family:Arial">Không tải được dữ liệu dashboard: '+e+'</div>'});
</script>
</body>
</html>
